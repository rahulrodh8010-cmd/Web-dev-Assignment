<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration Form</title>
  
</head>
<body>

  <div class="container">
    <h2>Student Registration Form</h2>

    <form action="#" method="post" onsubmit="return handleSubmit(event)">

      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" placeholder="Enter your full name" required><br><br>

      <label for="roll">Roll Number</label>
      <input type="text" id="roll" name="roll" placeholder="Enter your roll number" required><br><br>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="example@email.com" required><br><br>

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" placeholder="10-digit mobile number" required><br><br>

      <label for="dob">Date of Birth</label>
      <input type="date" id="dob" name="dob" required><br><br>

      <label>Gender</label>
      <div class="gender">
        <input type="radio" id="male" name="gender" value="Male" required>
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>
        <input type="radio" id="other" name="gender" value="Other">
        <label for="other">Other</label>
      </div><br><br>

      <label for="course">Course</label>
      <select id="course" name="course" required>
        <option value="">-- Select Course --</option>
        <option>B.Tech</option>
        <option>BCA</option>
        <option>B.Sc</option>
        <option>BBA</option>
        <option>MBA</option>
      </select><br><br>

      <label for="address">Address</label>
      <textarea id="address" name="address" rows="3" placeholder="Enter your address"></textarea><br><br>

      <div class="buttons">
        <button type="submit" class="submit">Register</button>
        <button type="reset" class="reset">Reset</button>
      </div>
    </form>
  </div><br><br>

  <script>
    function handleSubmit(event) {
      event.preventDefault();
      var name = document.getElementById("name").value;
      alert("Thank you, " + name + "! You have been registered successfully.");
      event.target.reset();
      return false;
    }
  </script>

</body>
</html>
